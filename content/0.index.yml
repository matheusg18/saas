title: Your inbox is [overwhelming.]{class="text-primary"} We fix that.
description: Sumio reads your emails and sends you one clean, intelligent daily digest on Telegram. Only what matters, nothing else.
seo:
  title: Sumio - Your AI Email Digest on Telegram
  description: Sumio reads your emails and sends you one clean, intelligent daily digest on Telegram. Only what matters, nothing else.
navigation: false
hero:
  links:
    - label: Start for free
      icon: i-lucide-arrow-right
      trailing: true
      to: /signup
      size: xl
    - label: See how it works
      icon: i-lucide-play
      size: xl
      color: neutral
      variant: subtle
      to: '#how-it-works'
sections:
  - title: How Sumio Works
    description: Three simple steps to reclaim your mornings. Connect your inbox, let AI do the reading, and get a smart summary delivered to your Telegram.
    id: how-it-works
    orientation: horizontal
    features:
      - name: Connect your email
        description: Securely link your Gmail or Outlook account. Sumio uses read-only access and never stores your email content.
        icon: i-lucide-link
      - name: AI reads for you
        description: Our AI analyzes every incoming email, identifies what matters, and filters out the noise automatically.
        icon: i-lucide-brain
      - name: Get your digest
        description: Receive a clean, prioritized summary on Telegram every morning. Tap to dive deeper into any item.
        icon: i-lucide-send
  - title: Built for Busy Professionals
    description: Whether you're a founder, developer, or manager, Sumio adapts to your workflow and keeps you informed without the overwhelm.
    orientation: horizontal
    reverse: true
    features:
      - name: Smart prioritization
        description: AI learns what matters to you over time. Urgent items surface first, newsletters get summarized, spam disappears.
        icon: i-lucide-sparkles
      - name: Privacy first
        description: Your emails are processed in real-time and never stored. End-to-end encryption and SOC 2 compliance.
        icon: i-lucide-shield-check
      - name: Works everywhere
        description: Telegram today, WhatsApp coming soon. Get your digest wherever you already spend your time.
        icon: i-lucide-smartphone
features:
  title: Why Choose Sumio
  description: Stop drowning in emails. Start each day with clarity and confidence knowing nothing important slipped through.
  items:
    - title: Intelligent Summaries
      description: AI doesn't just list emails. It extracts action items, deadlines, and key decisions so you can act fast.
      icon: i-lucide-file-text
    - title: Zero Setup Required
      description: Connect your email, open Telegram, and you're done. No rules to configure, no filters to maintain.
      icon: i-lucide-zap
    - title: Learn and Adapt
      description: Sumio gets smarter with every digest. Mark items as important or irrelevant and it adjusts automatically.
      icon: i-lucide-trending-up
    - title: Team Digests
      description: Share digest channels with your team. Everyone stays aligned without another meeting or Slack thread.
      icon: i-lucide-users
    - title: Secure by Design
      description: Read-only email access, no content storage, and full GDPR compliance. Your data stays yours.
      icon: i-lucide-lock
    - title: Multi-Account Support
      description: Connect personal and work inboxes. Get separate digests or combine them into one morning briefing.
      icon: i-lucide-layers
